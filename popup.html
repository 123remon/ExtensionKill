<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extension Kill Switch</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="panel">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="28" height="28">
          <rect x="4" y="4" width="40" height="40" rx="10" fill="#1e293b"/>
          <path d="M16 24h16" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="11" fill="none" stroke="#ef4444" stroke-width="3"/>
        </svg>
      </div>
      <div>
        <h1>Kill Switch</h1>
        <p id="statusLabel">Checking extensions...</p>
      </div>
    </header>

    <section class="stats" id="stats">
      <div class="stat">
        <span class="stat-value" id="enabledCount">-</span>
        <span class="stat-label">Enabled</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="totalCount">-</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="savedCount">-</span>
        <span class="stat-label">Saved</span>
      </div>
    </section>

    <button id="toggleBtn" class="switch running" type="button" disabled>
      <span class="switch-track">
        <span class="switch-knob"></span>
      </span>
      <span class="switch-text" id="toggleText">Loading</span>
    </button>

    <p class="hint" id="hint">
      Stop disables every other extension. Start turns back on only the ones that were enabled before.
    </p>

    <p class="error" id="error" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
<footer>
<p>MADE WITH ❤️ ABHISHEK KABIRAJ</p>
</footer>
</html>
